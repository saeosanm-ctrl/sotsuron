name: Run Rakuten API Daily

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # ① リポジトリ取得
      # =========================
      - name: コード取得
        uses: actions/checkout@v3

      # =========================
      # ② Python準備
      # =========================
      - name: Pythonセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # =========================
      # ③ ライブラリインストール
      # =========================
      - name: ライブラリインストール
        run: pip install -r requirements.txt

      # =========================
      # ④ 7地域データ取得
      # =========================
      - name: 7地域データ取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: |
          for area in fukuoka seibu kitakyusyu chikuzen kurume buzen chikugo
          do
            echo "Running $area"
            AREA=$area python main.py
            sleep 15
          done

      # =========================
      # ⑤ 日付ごとにマージ（★ここ変更）
      # =========================
      - name: CSV結合（日付ごと）
        run: python merge.py

      # =========================
      # ⑥ 元CSV削除（任意）
      # =========================
      - name: 元CSV削除
        run: rm -f fukuoka_*.csv seibu_*.csv kitakyusyu_*.csv chikuzen_*.csv kurume_*.csv buzen_*.csv chikugo_*.csv

      # =========================
      # ⑦ GitHubに保存
      # =========================
      - name: CSVを保存
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
      
          git add *.csv
      
          git commit -m "add merged csv" || echo "No changes"
      
          git push --force

