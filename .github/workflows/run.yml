name: Run Rakuten API Daily

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        area: [fukuoka, seibu, kitakyusyu, chikuzen, kurume, buzen, chikugo]

    steps:
      - name: コード取得
        uses: actions/checkout@v3

      - name: Pythonセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: ライブラリインストール
        run: pip install -r requirements.txt

      - name: 実行
        env:
          AREA: ${{ matrix.area }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python main.py

      - name: CSV保存
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
      
          git add *.csv
          git commit -m "add csv" || echo "No changes"
      
          git pull --rebase origin main || echo "rebase skip"
      
          git push
